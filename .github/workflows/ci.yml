name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-workflow-ref
  cancel-in-progress: true

env:
  HUSKY: 0
  CI: true

jobs:
  verify:
    name: Verify
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version-file: .node-version
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Set up tools
        run: npm run tools:setup
      
      - name: Run full check
        run: npm run check

  jsr:
    name: JSR Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version-file: .node-version
          cache: 'npm'
      
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Deno smoke test
        run: |
          deno run -A dist/jsr/cli.mjs --validate-policy .gitauthors
      
      - name: Deno publish dry-run
        run: |
          deno publish --dry-run --allow-dirty --config dist/jsr/jsr.json

  required:
    name: ci-required
    needs: [verify, jsr]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    steps:
      - name: Check job results
        run: |
          echo "Verify job: ${{ needs.verify.result }}"
          echo "JSR job: ${{ needs.jsr.result }}"
          
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "Verify job failed"
            exit 1
          fi
          
          if [ "${{ needs.jsr.result }}" != "success" ]; then
            echo "JSR job failed"
            exit 1
          fi
          
          echo "All required jobs passed"